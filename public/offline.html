<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Family Recipes</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #64748b; font-size: 0.95rem; line-height: 1.5; }
      .dot { font-size: 2.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">📡</div>
      <h1>You're offline</h1>
      <p>
        Open a grocery list once while connected, and it'll be available here
        even without signal. Reconnect to load the rest of the app.
      </p>
    </div>
  </body>
</html>
